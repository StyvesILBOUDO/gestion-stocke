{% extends "base.html" %}

{% block titre %}Connexion · StockPro{% endblock %}

{% block contenu %}
<div class="carte carte-connexion formulaire">
    <h1>Connexion</h1>
    <p class="sous-titre">Accédez à votre espace de gestion.</p>

    {% if erreur %}
    <div class="alerte-erreur">{{ erreur }}</div>
    {% endif %}

    <form method="POST">
        <label>Nom d'utilisateur
            <input type="text" name="nom" required autofocus>
        </label>
        <label>Mot de passe
            <input type="password" name="mot_de_passe" required>
        </label>
        <button type="submit" class="btn btn-primaire" style="width:100%;">Se connecter</button>
    </form>
</div>
{% endblock %}
