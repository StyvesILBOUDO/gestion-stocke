<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Enregistrer une vente</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        label { display: block; margin-top: 15px; }
        input, select { padding: 6px; width: 262px; }
        button { margin-top: 20px; padding: 8px 16px; background-color: #ff7900; color: white; border: none; cursor: pointer; }
        .erreur { color: red; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Enregistrer une vente</h1>

    {% if erreur %}
    <p class="erreur">{{ erreur }}</p>
    {% endif %}

    <form method="POST">
        <label>Produit
            <select name="produit_id" required>
                {% for produit in produits %}
                <option value="{{ produit['id'] }}">
                    {{ produit['nom'] }} (stock : {{ produit['quantite'] }})
                </option>
                {% endfor %}
            </select>
        </label>
        <label>Quantité vendue
            <input type="number" name="quantite" min="1" required>
        </label>
        <button type="submit">Valider la vente</button>
    </form>

    <p><a href="/">Retour à la liste</a></p>
</body>
</html>
