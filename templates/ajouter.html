{% extends "base.html" %}

{% block titre %}Ajouter un produit · StockPro{% endblock %}

{% block contenu %}
<div class="entete">
    <div>
        <h1>Ajouter un produit</h1>
        <p class="sous-titre">Renseignez les informations du nouveau produit.</p>
    </div>
</div>

<div class="carte formulaire">
    {% if erreur %}
    <div class="alerte-erreur">{{ erreur }}</div>
    {% endif %}

    <form method="POST">
        <label>Nom du produit
            <input type="text" name="nom" required>
        </label>
        <label>Prix (FCFA)
            <input type="number" name="prix" step="any" min="0" required>
        </label>
        <label>Quantité en stock
            <input type="number" name="quantite" min="0" required>
        </label>
        <button type="submit" class="btn btn-primaire">Ajouter</button>
        <a href="{{ url_for('accueil') }}" class="btn btn-contour">Annuler</a>
    </form>
</div>
{% endblock %}
