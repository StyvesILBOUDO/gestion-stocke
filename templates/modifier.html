{% extends "base.html" %}

{% block titre %}Modifier un produit · StockPro{% endblock %}

{% block contenu %}
<div class="entete">
    <div>
        <h1>Modifier le produit #{{ produit['id'] }}</h1>
        <p class="sous-titre">Mettez à jour les informations puis enregistrez.</p>
    </div>
</div>

<div class="carte formulaire">
    {% if erreur %}
    <div class="alerte-erreur">{{ erreur }}</div>
    {% endif %}

    <form method="POST">
        <label>Nom du produit
            <input type="text" name="nom" value="{{ produit['nom'] }}" required>
        </label>
        <label>Prix (FCFA)
            <input type="number" name="prix" step="any" min="0" value="{{ produit['prix'] }}" required>
        </label>
        <label>Quantité en stock
            <input type="number" name="quantite" min="0" value="{{ produit['quantite'] }}" required>
        </label>
        <button type="submit" class="btn btn-primaire">Enregistrer</button>
        <a href="{{ url_for('accueil') }}" class="btn btn-contour">Annuler</a>
    </form>
</div>
{% endblock %}
